const judge={timer:0,seen:new Set(),token:0,reset(){this.token++;clearTimeout(this.timer)},submit(text){const flag=game?.flag,card=game?.n,token=this.token,key=flag?.iso+'|'+card+'|'+norm(text);if(!judgeEndpoint||!game?.answerable||!flag||this.seen.has(key))return;this.seen.add(key);$('heard').textContent='Checking that answer…';clearTimeout(this.timer);this.timer=setTimeout(async()=>{try{const r=await fetch(judgeEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({transcript:text,target:flag.country,aliases:[flag.country,...flag.terms]})}),v=r.ok?await r.json():null;if(token!==this.token||!game?.answerable||game.flag!==flag||game.n!==card)return;if(v?.accept===true)correct();else if(game.mode==='chain')$('heard').textContent='Not quite — keep trying.'}catch{if(token===this.token&&game?.answerable&&game.flag===flag&&game.mode==='chain')$('heard').textContent='Not quite — keep trying.'}},250)}};function waitingToHear(){$('heard').textContent='Waiting to hear you…'}function showHeard(text){$('heard').textContent='I heard: “'+text.slice(-70)+'”'}function nextFlag(){judge.reset();cancelAnimationFrame(tick);$('feedback').className='feedback';$('typed').value='';game.flag=draw();game.n++;game.answerable=false;$('flag').src='https://flagcdn.com/w640/'+game.flag.iso+'.png';$('flag').onerror=()=>$('flag').src='https://flagcdn.com/'+game.flag.iso+'.svg';$('progress').textContent=game.mode==='chain'?'Longest chain':'Flag '+game.n+' of 10';$('score').textContent=game.mode==='chain'?game.chain+' in a row':game.right+' right';$('timerBar').style.width='100%';waitingToHear();if(game.ready)armCard();else {game.answerable=true;$('listenText').textContent='Getting voice ready… you can type now'}}
function armCard(){if(!game||!game.active)return;game.answerable=true;game.deadline=performance.now()+12000;$('dot').classList.toggle('live',voice.live);$('listenText').textContent=voice.live?'Listening — say the country':'Type your answer below';runTimer()}function runTimer(){const go=now=>{if(!game?.answerable)return;const left=Math.max(0,game.deadline-now);$('timerBar').style.width=(left/12000*100)+'%';if(!left)miss('Time is up — it was');else tick=requestAnimationFrame(go)};tick=requestAnimationFrame(go)}function correct(){if(!game?.answerable)return;game.answerable=false;cancelAnimationFrame(tick);game.right++;game.chain++;feedback(true,'Yes!','That is '+game.flag.country+'.')}function submit(text,fromVoice=false){if(!game?.answerable)return;if(matches(text,game.flag))correct();else if(text.trim()){if(!fromVoice)$('heard').textContent='Not quite — keep trying.';$('typed').select()}}function miss(prefix){if(!game?.answerable)return;game.answerable=false;cancelAnimationFrame(tick);feedback(false,prefix,game.flag.country+'.')}function feedback(ok,title,desc){const box=$('feedback');box.className='feedback show '+(ok?'good':'miss');$('feedbackTitle').textContent=title;$('feedbackText').textContent=desc;$('next').textContent=game.mode==='chain'&&!ok?'See my score':'Next flag'}function advance(){if(game.mode==='chain'&&$('feedback').classList.contains('miss'))return finish();if(game.mode==='practice'&&game.n>=10)return finish();nextFlag()}function finish(){stopVoice();show('finish');$('finishTitle').textContent=game.mode==='chain'?'Your chain: '+game.chain:'Great playing!';$('finishScore').textContent=game.mode==='chain'?'Can you make it longer next time?':game.right+' out of 10 flags right.';game.active=false}
$('answer').addEventListener('submit',e=>{e.preventDefault();submit($('typed').value);$('typed').select()});$('next').onclick=advance;$('again').onclick=()=>show('home');$('homeBtn').onclick=()=>{stopVoice();show('home')};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(b.dataset.mode));
const voice={socket:null,stream:null,ctx:null,source:null,processor:null,silent:null,live:false,async start(){this.live=false;try{this.stream=await navigator.mediaDevices.getUserMedia({audio:true});const C=window.AudioContext||window.webkitAudioContext;this.ctx=new C();this.source=this.ctx.createMediaStreamSource(this.stream);this.processor=this.ctx.createScriptProcessor(2048,1,1);this.silent=this.ctx.createGain();this.silent.gain.value=0;this.processor.onaudioprocess=e=>this.sendPcm(e.inputBuffer);this.source.connect(this.processor);this.processor.connect(this.silent);this.silent.connect(this.ctx.destination);if(this.ctx.state==='suspended')await this.ctx.resume();const u=new URL(endpoint);u.protocol=u.protocol==='https:'?'wss:':'ws:';u.search=new URLSearchParams({model:'nova-3',language:'en-GB',smart_format:'true',interim_results:'true',encoding:'linear16',sample_rate:'16000',channels:'1'});this.socket=new WebSocket(u);this.socket.onopen=()=>{this.live=true;if(game){game.ready=true;armCard()}};this.socket.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type!=='Results')return;const t=m.channel?.alternatives?.[0]?.transcript?.trim();if(t&&game?.answerable){showHeard(t);submit(t,true);if(m.is_final===true&&!matches(t,game.flag))judge.submit(t)}};this.socket.onerror=()=>this.fallback();this.socket.onclose=()=>{if(game?.active&&!this.live)this.fallback()};setTimeout(()=>{if(!this.live)this.fallback()},6000)}catch{this.fallback()}},sendPcm(b){if(!this.live||this.socket?.readyState!==1)return;const input=b.getChannelData(0),ratio=b.sampleRate/16000,out=new Int16Array(Math.floor(input.length/ratio));for(let i=0;i<out.length;i++){const v=Math.max(-1,Math.min(1,input[Math.floor(i*ratio)]));out[i]=v<0?v*32768:v*32767}try{this.socket.send(out.buffer)}catch{}},fallback(){if(!game||game.ready)return;game.ready=true;armCard()},stop(){this.live=false;try{this.socket?.close()}catch{};[this.processor,this.source,this.silent].forEach(n=>{try{n?.disconnect()}catch{}});try{this.ctx?.close()}catch{};this.stream?.getTracks().forEach(t=>t.stop());this.socket=this.stream=this.ctx=this.source=this.processor=this.silent=null}};function stopVoice(){judge.reset();cancelAnimationFrame(tick);voice.stop()}
</script></body></html>
